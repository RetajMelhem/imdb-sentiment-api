name: imdb-sentiment

services:
  api:
    build:
      context: .
    image: imdb-sentiment-api:1.1.0
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    environment:
      MODEL_PATH: /opt/model
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DEVICE: "${DEVICE:-cpu}"
      MAX_LENGTH: "${MAX_LENGTH-}"
      DECISION_THRESHOLD: "${DECISION_THRESHOLD-}"
      INFERENCE_BATCH_SIZE: "${INFERENCE_BATCH_SIZE-}"
      MAX_BATCH_SIZE: "${MAX_BATCH_SIZE:-32}"
      MAX_TEXT_CHARS: "${MAX_TEXT_CHARS:-100000}"
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-4194304}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MAX_CONCURRENT_INFERENCES: "${MAX_CONCURRENT_INFERENCES:-1}"
      INFERENCE_QUEUE_TIMEOUT_SECONDS: "${INFERENCE_QUEUE_TIMEOUT_SECONDS:-5}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
